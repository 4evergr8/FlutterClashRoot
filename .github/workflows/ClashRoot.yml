name: ClashRoot

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 2.2.4。留空则沿用现有版本号，只追加 commit hash，且不提交'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 下载代码
        uses: actions/checkout@v6

      - name: 获取 commit hash
        run: |
          echo "SHORT_HASH=$(git rev-parse --short=6 HEAD)" >> $GITHUB_ENV

      - name: 计算版本
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e

          PUB_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          PUB_BASE=${PUB_VERSION%%+*}
          PUB_CODE=${PUB_VERSION##*+}

          PROP_VERSION=$(grep '^version=' ClashRoot/module.prop | cut -d= -f2)
          PROP_CODE=$(grep '^versionCode=' ClashRoot/module.prop | cut -d= -f2)

          if [ -n "$INPUT_VERSION" ]; then
            NEW_PUB_BASE="$INPUT_VERSION"
            NEW_PROP_BASE="$INPUT_VERSION"
            NEW_PUB_CODE=$((PUB_CODE + 1))
            NEW_PROP_CODE=$((PROP_CODE + 1))
          else
            # 上次提交过的版本号里已带 hash，这里先剥掉，避免多次构建后 hash 累积
            NEW_PUB_BASE=${PUB_BASE%%-*}
            NEW_PROP_BASE=${PROP_VERSION%%-*}
            NEW_PUB_CODE="$PUB_CODE"
            NEW_PROP_CODE="$PROP_CODE"
          fi

          echo "pub=${NEW_PUB_BASE}-${SHORT_HASH}+${NEW_PUB_CODE}" >> $GITHUB_OUTPUT
          echo "prop_version=${NEW_PROP_BASE}-${SHORT_HASH}" >> $GITHUB_OUTPUT
          echo "prop_code=${NEW_PROP_CODE}" >> $GITHUB_OUTPUT

      - name: 写入版本
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.pub }}/" pubspec.yaml
          sed -i "s/^version=.*/version=${{ steps.version.outputs.prop_version }}/" ClashRoot/module.prop
          sed -i "s/^versionCode=.*/versionCode=${{ steps.version.outputs.prop_code }}/" ClashRoot/module.prop

      - name: 提交版本号变更
        if: ${{ github.event.inputs.version != '' }}
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml ClashRoot/module.prop
          git diff --staged --quiet || git commit -m "Bump version to $INPUT_VERSION"
          git push origin HEAD:${{ github.ref_name }}

      - name: 下载 GeoIP 和 Geosite
        run: |
          mkdir -p ClashRoot
          curl -L -o ClashRoot/geoip.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -L -o ClashRoot/geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat

      - name: 下载最新版本Clash
        run: |
          RELEASE_JSON=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)
          CLASH_URL=$(echo "$RELEASE_JSON" | grep -oP '"browser_download_url": "\K.*?mihomo-android-arm64-v8-v[0-9]+\.[0-9]+\.[0-9]+\.gz(?=")' | head -n 1)
          echo "Downloading Clash: $CLASH_URL"
          curl -L -o ClashRoot/clash.gz "$CLASH_URL"
          gunzip -f ClashRoot/clash.gz
          chmod +x ClashRoot/clash

      - name: 下载最新版本MetaCubeXD
        run: |
          RELEASE_JSON=$(curl -s https://api.github.com/repos/MetaCubeX/metacubexd/releases/latest)
          METACUBEXD_URL=$(echo "$RELEASE_JSON" | grep -oP '"browser_download_url": "\K.*?compressed-dist.tgz(?=")' | head -n 1)
          echo "Downloading MetaCubeXD: $METACUBEXD_URL"
          mkdir -p ClashRoot/metacubexd
          curl -L -o metacubexd.tgz "$METACUBEXD_URL"
          tar -xzf metacubexd.tgz -C ClashRoot/metacubexd
          rm metacubexd.tgz

      - name: 打包 ClashRoot.zip
        run: |
          HASH=$SHORT_HASH

          (cd ClashRoot && zip -r ../ClashRoot-${HASH}.zip .)

      - name: 上传模块包
        uses: actions/upload-artifact@v7
        with:
          name: ClashRoot-Module
          path: ClashRoot-*.zip
          archive: false

      - name: 设置Flutter环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - name: 安装依赖
        run: flutter pub get

      - name: Build APK (按 ABI 分割)
        run: |
          flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: 重命名 APK（加入 hash）
        run: |
          HASH=$SHORT_HASH

          mkdir -p output_apk

          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             output_apk/ClashRoot-${HASH}.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: ClashRoot-APK
          path: output_apk/*.apk
          archive: false
