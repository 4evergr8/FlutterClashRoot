mode: rule
external-controller: 0.0.0.0:9090
external-ui: ./metacubexd
allow-lan: false
log-level: warning
ipv6: false
disable-keep-alive: true
keep-alive-idle: 10
keep-alive-interval: 60
unified-delay: false
tcp-concurrent: true
geodata-loader: memconservative
find-process-mode: off
geo-auto-update: true
geo-update-interval: 24
etag-support: true
geodata-mode: true
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat"
profile:
  store-selected: false
  store-fake-ip: true


tun:
  enable: true
  stack: "gvisor"
  device: "tun0"
  auto-route: true
  auto-detect-interface: true
  strict-route: true


dns:
  enable: true
  cache-algorithm: lru
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - GEOSITE,cn
    - GEOSITE,googlefcm
    - GEOSITE,private
  nameserver:
    - tls://119.29.29.29:853
    - tls://223.5.5.5:853


rules:
  - GEOSITE,category-ads-all,REJECT

  - GEOSITE,cn,DIRECT
  - GEOIP,cn,DIRECT,no-resolve
  - GEOIP,private,DIRECT,no-resolve

  - GEOSITE,googlefcm,DIRECT
  - GEOSITE,private,DIRECT

  - DOMAIN-SUFFIX,trycloudflare.com,DIRECT

  - DOMAIN-SUFFIX,storage.googleapis.com,🌪️高速下载🌪️
  - GEOSITE,category-netdisk-!cn,🌪️高速下载🌪️
  - GEOSITE,youtube,🎶YouTube🎶

  - GEOSITE,category-ai-!cn,🧠人工智能🧠

  - GEOSITE,category-cryptocurrency,🪙加密货币🪙

  - GEOSITE,geolocation-!cn,📌节点选择📌

  - GEOIP,cn,DIRECT

  - MATCH,📌节点选择📌


proxy-groups:
  - name: 📌节点选择📌
    type: select
    filter: HK|香港|🇭🇰|US|美国|🇺🇸|JP|日本|🇯🇵
    include-all-proxies: true
    include-all-providers: true
    proxies:
      - ⚡自动选择⚡
      - 🌪️高速下载🌪️

  - name: ⚡自动选择⚡
    type: url-test
    url: https://www.google.com/generate_204
    interval: 600
    lazy: false
    expected-status: 204
    timeout: 3000
    max-failed-times: 3
    tolerance: 50
    exclude-filter: KR|韩国|🇰🇷
    include-all-proxies: true
    include-all-providers: true
    proxies: [ ]

  - name: 🧠人工智能🧠
    type: url-test
    url: https://api.openai.com/v1/models
    interval: 600
    lazy: true
    expected-status: 401
    timeout: 3000
    max-failed-times: 3
    tolerance: 50
    include-all-proxies: true
    include-all-providers: true
    proxies: [ ]

  - name: 🪙加密货币🪙
    type: url-test
    url: https://api.binance.com/api/v3/ping
    expected-status: 200
    interval: 600
    lazy: true
    timeout: 3000
    max-failed-times: 3
    tolerance: 50
    exclude-filter: US|美国|🇺🇸
    include-all-proxies: true
    include-all-providers: true
    proxies: [ ]

  - name: 🎶YouTube🎶
    type: url-test
    url: https://one.google.com
    expected-status: 302
    interval: 600
    lazy: true
    timeout: 3000
    max-failed-times: 3
    exclude-filter: KR|韩国|🇰🇷
    include-all-proxies: true
    include-all-providers: true
    proxies: [ ]

  - name: 🌪️高速下载🌪️
    type: load-balance
    strategy: round-robin
    url: https://www.google.com/generate_204
    expected-status: 204
    interval: 600
    timeout: 3000
    max-failed-times: 3
    include-all-proxies: true
    include-all-providers: true
    proxies: [ ]


proxy-providers:
  provider:
    type: http
    url:
    path:
    interval: 10800
    size-limit: 0
    header:
      User-Agent:
        - "clash.meta"
    exclude-filter: KR|韩国|🇰🇷
    health-check:
      enable: true
      url: https://www.google.com/generate_204
      interval: 600
      timeout: 3000
      lazy: true
      expected-status: 204